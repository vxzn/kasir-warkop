" height="104" rx="10" fill="#fff" stroke="#d9c9b8" stroke-width="1.5"/><rect x="50" y="342" width="64" height="84" rx="8" fill="#8a5200" stroke="#8c7a6a" stroke-width="1.5"/><text x="126" y="362" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="start">Menunggu / menipis</text><text x="126" y="382" font-size="12" font-weight="400" fill="#5f5045" text-anchor="start">warn · #8a5200</text><text x="126" y="404" font-size="12" font-weight="400" fill="#2b1d14" text-anchor="start">vs putih: 6.39 : 1</text><text x="126" y="422" font-size="12" font-weight="700" fill="#1f6b2a" text-anchor="start">Lolos (min 4.5 : 1)</text><rect x="302" y="332" width="244" height="104" rx="10" fill="#fff" stroke="#d9c9b8" stroke-width="1.5"/><rect x="312" y="342" width="64" height="84" rx="8" fill="#a8201a" stroke="#8c7a6a" stroke-width="1.5"/><text x="388" y="362" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="start">Batal / bahaya</text><text x="388" y="382" font-size="12" font-weight="400" fill="#5f5045" text-anchor="start">bad · #a8201a</text><text x="388" y="404" font-size="12" font-weight="400" fill="#2b1d14" text-anchor="start">vs putih: 7.28 : 1</text><text x="388" y="422" font-size="12" font-weight="700" fill="#1f6b2a" text-anchor="start">Lolos (min 4.5 : 1)</text><rect x="564" y="332" width="244" height="104" rx="10" fill="#fff" stroke="#d9c9b8" stroke-width="1.5"/><rect x="574" y="342" width="64" height="84" rx="8" fill="#4a5560" stroke="#8c7a6a" stroke-width="1.5"/><text x="650" y="362" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="start">Selesai</text><text x="650" y="382" font-size="12" font-weight="400" fill="#5f5045" text-anchor="start">done · #4a5560</text><text x="650" y="404" font-size="12" font-weight="400" fill="#2b1d14" text-anchor="start">vs putih: 7.61 : 1</text><text x="650" y="422" font-size="12" font-weight="700" fill="#1f6b2a" text-anchor="start">Lolos (min 4.5 : 1)</text><rect x="826" y="332" width="244" height="104" rx="10" fill="#fff" stroke="#d9c9b8" stroke-width="1.5"/><rect x="836" y="342" width="64" height="84" rx="8" fill="#0b57d0" stroke="#8c7a6a" stroke-width="1.5"/><text x="912" y="362" font-size="13" font-weight="700" fill="#2b1d14" text-anchor="start">Cincin fokus</text><text x="912" y="382" font-size="12" font-weight="400" fill="#5f5045" text-anchor="start">focus · #0b57d0</text><text x="912" y="404" font-size="12" font-weight="400" fill="#2b1d14" text-anchor="start">vs surface: 6.39 : 1</text><text x="912" y="422" font-size="12" font-weight="700" fill="#1f6b2a" text-anchor="start">Lolos (min 3 : 1)</text><text x="40" y="478" font-size="15" font-weight="700" fill="#2b1d14" text-anchor="start">Tipografi (font sistem: cepat dimuat dan akrab di setiap platform)</text><text x="40" y="506" font-size="20" font-weight="700" fill="#2b1d14" text-anchor="start">Judul halaman  20 / 700</text><text x="40" y="534" font-size="18" font-weight="700" fill="#2b1d14" text-anchor="start">Judul bagian  18 / 700</text><text x="40" y="562" font-size="16" font-weight="400" fill="#2b1d14" text-anchor="start">Teks isi  16 / 400 (minimum di input agar iOS tidak memperbesar)</text><text x="40" y="590" font-size="14" font-weight="400" fill="#5f5045" text-anchor="start">Teks bantu  14 / 400</text><text x="40" y="618" font-size="12.5" font-weight="400" fill="#5f5045" text-anchor="start">Keterangan  12-13 / 400-700 (hanya untuk info tambahan)</text><text x="40" y="668" font-size="15" font-weight="700" fill="#2b1d14" text-anchor="start">Ukuran dan jarak</text><rect x="40" y="684" width="48" height="48" rx="10" fill="#fff" stroke="#8c7a6a" stroke-width="1.5"/><text x="100" y="700" font-size="13" font-weight="400" fill="#2b1d14" text-anchor="start">Target sentuh minimum 44 px</text><text x="100" y="718" font-size="12.5" font-weight="400" fill="#5f5045" text-anchor="start">(kontrol utama 48-56 px: +/−, kolom isian, tombol utama)</text><text x="100" y="736" font-size="12.5" font-weight="400" fill="#5f5045" text-anchor="start">Jarak antar panel 16 px; radius sudut 10-12 px</text><text x="560" y="668" font-size="15" font-weight="700" fill="#2b1d14" text-anchor="start">Status komponen</text><rect x="560" y="684" width="120" height="48" rx="8" fill="#6f4e37" stroke="#6f4e37" stroke-width="2"/><text x="620.0" y="712.6666666666666" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Utama</text><rect x="692" y="684" width="120" height="48" rx="8" fill="#ffffff" stroke="#6f4e37" stroke-width="2"/><text x="752.0" y="712.6666666666666" font-size="14" font-weight="700" fill="#6f4e37" text-anchor="middle">Sekunder</text><rect x="824" y="684" width="120" height="48" rx="10" fill="#fff" stroke="#a8201a" stroke-width="2"/><text x="884" y="713" font-size="14" font-weight="700" fill="#a8201a" text-anchor="middle">Bahaya</text><rect x="956" y="684" width="104" height="48" rx="10" fill="#6f4e37" stroke="#6f4e37" stroke-width="2"/><rect x="951" y="679" width="114" height="58" rx="13" fill="none" stroke="#0b57d0" stroke-width="3"/><text x="1008" y="713" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Fokus</text><rect x="560" y="758" width="122" height="26" rx="13" fill="#8a5200" stroke="#8a5200" stroke-width="1.5"/><text x="621" y="776" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">○ Menunggu bayar</text><rect x="690" y="758" width="122" height="26" rx="13" fill="#1f6b2a" stroke="#1f6b2a" stroke-width="1.5"/><text x="751" y="776" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">● Sudah dibayar</text><rect x="820" y="758" width="122" height="26" rx="13" fill="#4a5560" stroke="#4a5560" stroke-width="1.5"/><text x="881" y="776" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">✔ Selesai</text><rect x="950" y="758" width="122" height="26" rx="13" fill="#a8201a" stroke="#a8201a" stroke-width="1.5"/><text x="1011" y="776" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">✕ Dibatalkan</text><text x="560" y="806" font-size="12.5" font-weight="400" fill="#5f5045" text-anchor="start">Status selalu memakai ikon + teks, tidak hanya warna.</text><text x="40" y="780" font-size="14" font-weight="700" fill="#2b1d14" text-anchor="start">Prinsip: sederhana, jelas, memaafkan kesalahan.</text><text x="40" y="802" font-size="13" font-weight="400" fill="#5f5045" text-anchor="start">Aksi yang merusak (batal, kosongkan) selalu meminta konfirmasi,</text><text x="40" y="820" font-size="13" font-weight="400" fill="#5f5045" text-anchor="start">dengan fokus awal pada pilihan yang aman ('Kembali').</text></svg>
