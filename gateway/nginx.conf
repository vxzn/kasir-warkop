server {
    listen 80;
    server_name _;

    # Frontend kasir (file statis)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Gateway: satu pintu masuk, diteruskan ke layanan masing-masing.
    # /api/menu/...    -> layanan menu       /menu/...
    # /api/pesanan/... -> layanan pesanan    /pesanan/...
    # /api/tagihan/... -> layanan pembayaran /tagihan/...
    location /api/menu {
        proxy_pass http://menu:8000/menu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/pesanan {
        proxy_pass http://pesanan:8000/pesanan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/tagihan {
        proxy_pass http://pembayaran:8000/tagihan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
