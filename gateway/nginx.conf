server {
    listen 80;
    server_name _;

    # Frontend kasir (file statis)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker harus selalu diperiksa ulang oleh browser.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # API Gateway: satu pintu masuk, diteruskan ke layanan masing-masing.
    # /api/auth/...    -> layanan auth       /auth/...
    # /api/menu/...    -> layanan menu       /menu/...
    # /api/pesanan/... -> layanan pesanan    /pesanan/...
    # /api/tagihan/... -> layanan pembayaran /tagihan/...
    #
    # Header Authorization (token pengguna) diteruskan apa adanya; tiap layanan memeriksanya sendiri.
    # X-Service-Key dikosongkan: kunci antar-layanan hanya boleh beredar di jaringan internal Docker,
    # jadi klien luar tidak bisa menyamar sebagai layanan walau menebak nama headernya.
    location /api/auth {
        proxy_pass http://auth:8000/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Key "";
    }

    location /api/menu {
        proxy_pass http://menu:8000/menu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Key "";
    }

    location /api/pesanan {
        proxy_pass http://pesanan:8000/pesanan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Key "";
    }

    location /api/tagihan {
        proxy_pass http://pembayaran:8000/tagihan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Key "";
    }
}
