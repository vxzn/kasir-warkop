<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Warkop</title>
<meta name="description" content="Kasir warung kopi: pesan, bayar, dan pantau pesanan dari HP, tablet, atau komputer.">
<meta name="theme-color" content="#6F4E37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="menu">
<a class="skip" href="#sec-menu">Langsung ke menu</a>

<header class="topbar">
  <h1><span aria-hidden="true">&#9749;</span> Kasir Warkop</h1>
  <p id="laporan" class="laporan" aria-live="polite">Memuat laporan&hellip;</p>
</header>

<div id="offline" class="offline" role="status" hidden>
  Tidak ada koneksi. Pesanan baru tidak dapat dikirim sampai tersambung kembali.
</div>

<main class="layout">
  <!-- MENU -->
  <section id="sec-menu" class="panel area-menu" aria-labelledby="h-menu">
    <h2 id="h-menu">Menu</h2>
    <div class="cari">
      <label for="cari" class="sr">Cari menu</label>
      <input id="cari" type="search" placeholder="Cari menu, mis. kopi" autocomplete="off">
    </div>
    <div id="kategori" class="chips" role="group" aria-label="Filter kategori"></div>
    <div id="menu" class="menu-grid" aria-live="polite"></div>
  </section>

  <!-- KERANJANG -->
  <aside id="sec-keranjang" class="panel area-cart" aria-labelledby="h-cart">
    <div class="judul-baris">
      <h2 id="h-cart">Keranjang</h2>
      <button type="button" id="kosongkan" class="btn kecil teks" hidden>Kosongkan</button>
    </div>
    <div class="isian">
      <div>
        <label for="nama">Nama pelanggan</label>
        <input id="nama" placeholder="Pelanggan" autocomplete="off" maxlength="40">
      </div>
      <div>
        <label for="meja">Meja</label>
        <input id="meja" placeholder="opsional" autocomplete="off" maxlength="10">
      </div>
    </div>
    <div id="keranjang" class="keranjang"></div>
    <div class="total"><span>Total</span><strong id="total">Rp 0</strong></div>
    <button type="button" id="buat" class="btn besar penuh" disabled>Buat Pesanan</button>
    <p id="petunjuk" class="petunjuk">Pilih menu dulu untuk membuat pesanan.</p>
  </aside>

  <!-- PESANAN -->
  <section id="sec-pesanan" class="panel area-orders" aria-labelledby="h-orders">
    <div class="judul-baris">
      <h2 id="h-orders">Daftar Pesanan</h2>
      <div class="chips kecil" role="group" aria-label="Tampilkan pesanan">
        <button type="button" class="chip" data-tampil="aktif" aria-pressed="true">Aktif</button>
        <button type="button" class="chip" data-tampil="semua" aria-pressed="false">Semua</button>
      </div>
    </div>
    <div id="pesanan" aria-live="polite"></div>
  </section>
</main>

<!-- Navigasi bawah: hanya tampil di HP -->
<nav class="bottomnav" aria-label="Navigasi utama">
  <button type="button" data-tab="menu" aria-current="page"><span aria-hidden="true">&#9776;</span>Menu</button>
  <button type="button" data-tab="keranjang">
    <span aria-hidden="true">&#128722;</span>Keranjang
    <span id="badge" class="badge-n" hidden>0</span>
  </button>
  <button type="button" data-tab="pesanan"><span aria-hidden="true">&#128203;</span>Pesanan</button>
</nav>

<!-- Dialog pembayaran -->
<dialog id="dlg-bayar" aria-labelledby="dlg-judul">
  <form id="form-bayar" method="dialog">
    <h2 id="dlg-judul">Bayar pesanan <span id="dlg-id"></span></h2>
    <div class="total"><span>Total tagihan</span><strong id="dlg-total"></strong></div>

    <label for="metode">Metode pembayaran</label>
    <select id="metode">
      <option value="TUNAI">Tunai</option>
      <option value="QRIS">QRIS</option>
      <option value="TRANSFER">Transfer</option>
    </select>

    <div id="blok-tunai">
      <label for="bayar">Uang diterima (Rp)</label>
      <input id="bayar" type="number" inputmode="numeric" min="1" required>
      <div id="cepat" class="chips kecil" role="group" aria-label="Pilih nominal cepat"></div>
      <p id="kembalian" class="kembalian" aria-live="polite"></p>
    </div>

    <div class="aksi">
      <button type="button" class="btn alt" id="bayar-tutup">Tutup</button>
      <button type="submit" class="btn" id="bayar-ok">Konfirmasi pembayaran</button>
    </div>
  </form>
</dialog>

<!-- Dialog konfirmasi -->
<dialog id="dlg-tanya" role="alertdialog" aria-labelledby="tanya-judul" aria-describedby="tanya-isi">
  <h2 id="tanya-judul"></h2>
  <p id="tanya-isi"></p>
  <div class="aksi">
    <button type="button" class="btn alt" id="tanya-tidak">Kembali</button>
    <button type="button" class="btn bahaya" id="tanya-ya"></button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
